<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>油耗助手 | Trợ lý tiêu thụ xăng</title>
    <style>
        body { font-family: "PingFang TC", sans-serif; background: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { margin: 0 0 15px 0; color: #1a73e8; text-align: center; font-size: 1.2rem; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .stat-box { background: #e8f0fe; padding: 10px; border-radius: 10px; text-align: center; }
        .stat-label { font-size: 11px; color: #5f6368; display: block; }
        .stat-value { font-size: 16px; font-weight: bold; color: #1a73e8; display: block; margin-top: 5px; }
        label { display: block; margin-top: 10px; color: #5f6368; font-size: 13px; font-weight: bold; }
        .lang-hint { font-weight: normal; color: #999; font-size: 12px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        .record-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 6px solid #1a73e8; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .record-info { display: flex; justify-content: space-between; font-size: 12px; color: #3c4043; }
        .consumption { font-size: 20px; font-weight: bold; color: #d93025; margin: 5px 0; }
        .del-btn { position: absolute; right: 10px; bottom: 10px; color: #999; font-size: 11px; cursor: pointer; border: 1px solid #eee; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <!-- 統計看板 -->
    <div class="card">
        <h2>📊 統計概況 / Thống kê</h2>
        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-label">本週平均油耗<br><span class="lang-hint">TB trong tuần</span></span>
                <span class="stat-value" id="weekAvg">-</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">本月平均油耗<br><span class="lang-hint">TB trong tháng</span></span>
                <span class="stat-value" id="monthAvg">-</span>
            </div>
        </div>
    </div>

    <!-- 輸入區域 -->
    <div class="card">
        <h2>⛽ 新增加油 / Thêm mới</h2>
        <label>目前總里程 (km) / Tổng số km hiện tại</label>
        <input type="number" id="mileage" inputmode="decimal" placeholder="VD: 10500">
        <label>本次加油量 (L) / Lượng xăng đổ (L)</label>
        <input type="number" id="liters" inputmode="decimal" placeholder="VD: 5.2">
        <button onclick="addRecord()">儲存紀錄 / Lưu lại</button>
    </div>

    <div id="history"></div>
</div>

<script>
    window.onload = render;

    function addRecord() {
        const m = parseFloat(document.getElementById('mileage').value);
        const l = parseFloat(document.getElementById('liters').value);
        if (isNaN(m) || isNaN(l)) return alert("請輸入數值 / Vui lòng nhập số");

        let data = JSON.parse(localStorage.getItem('gas_tracker_v3') || "[]");
        let kmPerL = "首次紀錄 / Lần đầu";
        
        if (data.length > 0) {
            let lastM = data[0].m;
            if (m <= lastM) return alert("里程需大於上次紀錄 / Số km phải lớn hơn lần trước: " + lastM);
            kmPerL = ((m - lastM) / l).toFixed(2);
        }

        const newEntry = {
            m: m, l: l, kmPerL: kmPerL,
            timestamp: Date.now(),
            date: new Date().toLocaleDateString()
        };

        data.unshift(newEntry);
        localStorage.setItem('gas_tracker_v3', JSON.stringify(data));
        document.getElementById('liters').value = "";
        render();
    }

    function calculateStats(data) {
        const now = Date.now();
        const oneDay = 24 * 60 * 60 * 1000;
        const getAvg = (days) => {
            const filtered = data.filter(item => (now - item.timestamp) <= (days * oneDay));
            const validConsumptions = filtered.filter(i => i.kmPerL !== "首次紀錄 / Lần đầu").map(i => parseFloat(i.kmPerL));
            if (validConsumptions.length === 0) return "-";
            const sum = validConsumptions.reduce((a, b) => a + b, 0);
            return (sum / validConsumptions.length).toFixed(2) + " km/L";
        };
        document.getElementById('weekAvg').innerText = getAvg(7);
        document.getElementById('monthAvg').innerText = getAvg(30);
    }

    function render() {
        let data = JSON.parse(localStorage.getItem('gas_tracker_v3') || "[]");
        calculateStats(data);
        const historyDiv = document.getElementById('history');
        historyDiv.innerHTML = data.map((item, index) => `
            <div class="record-item">
                <div class="record-info"><span>📅 ${item.date}</span><span>里程/km: ${item.m}</span></div>
                <div class="record-info"><span>加油/Lít: ${item.l}</span></div>
                <div class="consumption">${item.kmPerL}<span style="font-size:12px">${item.kmPerL.includes("首次") ? "" : " km/L"}</span></div>
                <div class="del-btn" onclick="deleteItem(${index})">刪除 / Xóa</div>
            </div>
        `).join('');
    }

    function deleteItem(index) {
        if(confirm("確定刪除？ / Bạn có chắc chắn muốn xóa?")) {
            let data = JSON.parse(localStorage.getItem('gas_tracker_v3'));
            data.splice(index, 1);
            localStorage.setItem('gas_tracker_v3', JSON.stringify(data));
            render();
        }
    }
</script>
</body>
</html>
